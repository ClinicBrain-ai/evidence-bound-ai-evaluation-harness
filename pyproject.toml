[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-bound-ai-evaluation-harness"
version = "0.3.0"
description = "Portfolio-grade prototype for evaluating AI-generated healthcare-adjacent outputs against source evidence and reviewability criteria."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
  { name = "Patrick Chen" }
]
dependencies = [
  "jsonschema",
]

[project.scripts]
evidence-bound-eval = "evidence_bound_ai_evaluation_harness.cli:main"

[tool.setuptools]
packages = ["evidence_bound_ai_evaluation_harness", "evidence_bound_ai_evaluation_harness.schemas"]

[tool.setuptools.package-dir]
"evidence_bound_ai_evaluation_harness.schemas" = "schemas"

[tool.setuptools.package-data]
"evidence_bound_ai_evaluation_harness.schemas" = ["evaluation_report.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
